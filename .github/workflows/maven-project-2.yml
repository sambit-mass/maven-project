name: Maven CI

on:
  push:
    branches: [ "maven-2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Run JAR (like Jenkins deploy stage)
        run: java -jar target/java-project2-1.8.jar
